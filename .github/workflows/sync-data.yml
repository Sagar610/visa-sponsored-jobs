name: Sync job data

on:
  schedule:
    # Daily 05:30 UTC
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Sync jobs, sponsors and visa news
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: npm run sync

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/sponsors.json data/meta.json data/news.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes"
            exit 0
          fi
          git commit -m "chore: refresh synced job and sponsor data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # visasponsoredjobs.vercel.app is a manual alias and does not move with
      # production deploys unless we re-point it (alpha URL does auto-update).
      - name: Point production vanity URL at latest deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Skipping alias update — set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID repo secrets."
            exit 0
          fi
          npm install -g vercel@59
          for i in $(seq 1 36); do
            STATE=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=1&target=production" \
              | python3 -c 'import sys,json; d=json.load(sys.stdin)["deployments"][0]; print(d.get("readyState",""), d.get("url",""))')
            echo "$STATE"
            READY=$(echo "$STATE" | awk '{print $1}')
            URL=$(echo "$STATE" | awk '{print $2}')
            if [ "$READY" = "READY" ] && [ -n "$URL" ]; then
              vercel alias set "$URL" visasponsoredjobs.vercel.app --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
              exit 0
            fi
            if [ "$READY" = "ERROR" ] || [ "$READY" = "CANCELED" ]; then
              echo "Deploy failed: $READY"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for Vercel production deploy"
          exit 1
